# See https://wiki.hyprland.org/Configuring/Monitors/

# Source a file (multi-file configs)
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/styling.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/layout.conf

# monitor=eDP-1,3840x2400@60.0,0x0,2.0
# monitor=eDP-1,disable
# monitor=DP-1,3440x1440@60.00,mirror,eDP-1
# monitor = DP-1, 1920x1080,mirror,eDP-1
# monitor = eDP-1, 1920x1080@60, 0x0, 1


# exec-once = $HOME/dotfiles/dotfiles/.config/hypr/enableLaptopIfOnly.sh

# Some default env vars.
env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,24


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = no
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        disable_while_typing = true
        natural_scroll = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

misc {
    disable_hyprland_logo = true

    focus_on_activate = true

    enable_swallow = true
    swallow_regex = ^(ghostty)$
}

# Trengs for screen sharing https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

# tempfix for hyprland + edge
windowrule = no_initial_focus true, float true, move cursor_x cursor_y, match:class ^()$,match:title ^()$,match:initial_class ^()$,match:initial_title ^()$

# Må stå nederst
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

env = XDG_CURRENT_DESKTOP,Hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP



